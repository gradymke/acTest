[project]
name = "actest"
version = "0.1.0"
description = "This is a test app for AWS AppConfig"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.0",
    "botocore[crt]>=1.26.0",
    "flask>=3.1.3",
    "openfeature-sdk>=0.8.2",
    "openfeature-provider-unleash>=0.1.2",
    "openfeature-provider-flagd>=0.4.1,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
